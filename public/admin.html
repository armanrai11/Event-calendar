<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Event Calendar Backend Data</title>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; background: #f6f7f9; color: #1f2937; margin: 0; padding: 24px; }
    h1 { margin: 0 0 4px; color: #111827; } p { color: #4b5563; }
    a { color: #2563eb; }
    .bar { display: flex; gap: 10px; align-items: center; margin: 14px 0; flex-wrap: wrap; }
    button { cursor: pointer; border: 1px solid #2563eb; border-radius: 8px; padding: 8px 14px; background: #2563eb; color: #fff; font-weight: 600; }
    .del { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; padding: 5px 10px; }
    table { width: 100%; border-collapse: collapse; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e5e7eb; font-size: .92rem; vertical-align: top; }
    th { background: #f8fafc; color: #111827; }
    .mono { font-family: Consolas, monospace; font-size: .78rem; word-break: break-all; }
    .empty { padding: 18px; color: #6b7280; }
    .pill { background: #dcfce7; color: #166534; padding: 3px 10px; border-radius: 999px; font-size: .8rem; }
  </style>
</head>
<body>
  <h1>Admin — Backend Data</h1>
  <p>This page reads live from the backend API (<span class="mono">GET /api/admin/events</span>) which reads from the
     <strong>events</strong> collection in MongoDB. <a href="/">← Back to calendar</a></p>
  <div class="bar">
    <span class="pill" id="dbStatus">MongoDB: checking…</span>
    <span id="count"></span>
    <button onclick="load()">Refresh now</button>
    <label><input type="checkbox" id="auto" checked /> Auto-refresh (5s)</label>
  </div>
  <h2>Registered users</h2>
  <p style="font-size:.85rem">Usernames only — passwords are bcrypt-hashed and can never be shown.</p>
  <div id="usersWrap"></div>
  <h2>All events</h2>
  <div id="wrap"></div>
  <script>
    const TOKEN = localStorage.getItem("ec_token");
    if (!TOKEN) location.replace("/login.html"); // login first
    const H = () => ({ "x-auth-token": localStorage.getItem("ec_token") || "" });
    async function load() {
      try {
        const st = await (await fetch("/api/status")).json().catch(() => ({}));
        const evRes = await fetch("/api/admin/events", { headers: H() });
        if (evRes.status === 401) { location.replace("/login.html"); return; }
        if (evRes.status === 403) {
          document.getElementById("dbStatus").textContent = "Admins only";
          document.getElementById("count").textContent = "";
          document.getElementById("usersWrap").innerHTML = '<div class="empty">This page is for admins only. You are logged in as a regular user.</div>';
          document.getElementById("wrap").innerHTML = "";
          return;
        }
        const events = await evRes.json();
        const users = await (await fetch("/api/admin/users", { headers: H() })).json().catch(() => []);
        document.getElementById("usersWrap").innerHTML = users.length
          ? `<table><tr><th>Username</th><th>Registered</th></tr>` +
            users.map(u => `<tr><td><strong>${u.username || ""}</strong></td><td>${u.createdAt || "-"}</td></tr>`).join("") + `</table>`
          : '<div class="empty">No registered users yet.</div>';
        document.getElementById("dbStatus").textContent = st.storage === "MongoDB"
          ? "MongoDB: connected (database: eventdb, collection: events)"
          : "Storage: " + (st.storage || "unknown") + " (not MongoDB)";
        document.getElementById("count").textContent = events.length + " event(s) stored";
        if (!events.length) {
          document.getElementById("wrap").innerHTML = '<div class="empty">No events in the database yet. Add one from the calendar page and it will appear here.</div>';
          return;
        }
        let rows = events.map(e => `<tr>
          <td class="mono">${e._id}</td><td><strong>${e.title || ""}</strong></td>
          <td>${e.date || ""}</td><td>${e.time || "-"}</td><td>${e.category || ""}</td><td>${e.username || "-"}</td>
          <td>${e.description || ""}</td><td class="mono">${e.createdAt || ""}</td>
          <td><button class="del" onclick="del('${e._id}')">Delete</button></td></tr>`).join("");
        document.getElementById("wrap").innerHTML =
          `<table><tr><th>_id (MongoDB)</th><th>Title</th><th>Date</th><th>Time</th><th>Category</th><th>Owner</th><th>Description</th><th>Created At</th><th></th></tr>${rows}</table>`;
      } catch (err) {
        document.getElementById("dbStatus").textContent = "Backend not reachable — is the server running?";
      }
    }
    async function del(id) {
      if (!confirm("Delete this event from the database?")) return;
      await fetch("/api/admin/events/" + id, { method: "DELETE", headers: H() });
      load();
    }
    setInterval(() => { if (document.getElementById("auto").checked) load(); }, 5000);
    load();
  </script>
</body>
</html>
