<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- build-marker: root-fix-v2 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Calendar 3D</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
</head>
<body>
  <!-- 3D background (Three.js renders floating shapes into this canvas) -->
  <canvas id="bg3d"></canvas>

  <header>
    <h1>📅 Event Calendar <span>3D</span></h1>
    <p>Create, view, edit and delete events — full CRUD with a MongoDB backend.</p>
    <div class="authbar">
      <span id="whoami"></span>
      <a class="badge" href="admin.html">🛠️ Admin</a>
      <a class="badge" id="loginLink" href="login.html">🔐 Login</a>
      <button id="logoutBtn" class="ghost" hidden>Logout</button>
    </div>
  </header>

  <main>
    <!-- Calendar card with 3D tilt on mouse move -->
    <section class="card tilt" id="calendarCard">
      <div class="cal-head">
        <button id="prevBtn">◀</button>
        <h2 id="monthLabel"></h2>
        <button id="nextBtn">▶</button>
      </div>
      <div class="weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="grid" id="calendarGrid"></div>
      <p class="hint">Click any date to add an event on that day.</p>
    </section>

    <!-- Add / Edit form -->
    <section class="card">
      <h2 id="formTitle">➕ Add Event</h2>
      <form id="eventForm">
        <input type="hidden" id="eventId" />
        <label>Title * <input id="title" required placeholder="e.g. Project demo" /></label>
        <label>Date * <input id="date" type="date" required /></label>
        <label>Time <input id="time" type="time" /></label>
        <label>Category
          <select id="category">
            <option>Work</option><option>Personal</option><option>Study</option>
            <option>Birthday</option><option selected>Other</option>
          </select>
        </label>
        <label>Description <textarea id="description" rows="2" placeholder="Short note..."></textarea></label>
        <div class="row">
          <button type="submit" class="primary" id="saveBtn">Save Event</button>
          <button type="button" id="cancelEdit" class="ghost" hidden>Cancel Edit</button>
        </div>
      </form>
      <p id="status" class="status"></p>
    </section>
  </main>

  <!-- Events of the selected / current view -->
  <section class="card wide">
    <h2>🗂️ Events</h2>
    <input id="search" placeholder="🔍 Search events..." />
    <div id="eventList" class="event-list"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
